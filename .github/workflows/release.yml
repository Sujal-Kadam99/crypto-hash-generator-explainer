name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test
        
      - name: Create release zip
        run: |
          mkdir -p crypto-hash-generator-explainer
          cp index.html style.css LICENSE README.md crypto-hash-generator-explainer/
          mkdir -p crypto-hash-generator-explainer/js
          cp js/hash_tool.js crypto-hash-generator-explainer/js/
          zip -r "crypto-hash-generator-explainer-${{ github.ref_name }}.zip" crypto-hash-generator-explainer
          
      - name: Generate Checksums
        run: |
          sha256sum "crypto-hash-generator-explainer-${{ github.ref_name }}.zip" > SHA256SUMS.txt
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crypto-hash-generator-explainer-${{ github.ref_name }}.zip
            SHA256SUMS.txt
